name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          pnpm --version

      - name: Harden npm/pnpm network settings
        shell: bash
        run: |
          cat > .npmrc <<'NPMRC'
          registry=https://registry.npmjs.org/
          fetch-retries=5
          fetch-retry-factor=2
          fetch-retry-mintimeout=20000
          fetch-retry-maxtimeout=120000
          NPMRC

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          pnpm --version

      - name: Harden npm/pnpm network settings
        shell: bash
        run: |
          cat > .npmrc <<'NPMRC'
          registry=https://registry.npmjs.org/
          fetch-retries=5
          fetch-retry-factor=2
          fetch-retry-mintimeout=20000
          fetch-retry-maxtimeout=120000
          NPMRC

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E tests
        env:
          TEST_MODE: '1'
          NEXT_PUBLIC_TEST_MODE: '1'
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
